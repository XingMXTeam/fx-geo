<script>
/* 取数双模式（本脚本先于主脚本运行）：
   1) window.__GEO_CONFIG__ = { supabaseUrl, anonKey } 存在时：直查 Supabase PostgREST，
      在前端拼出与本地 /api/* 完全相同的数据结构渲染（活数据）；
   2) 配置缺失、或活数据任一查询失败：不接管 / 回退到下一层 fetch
      （静态版是 export_static.py 注入的 __GEO_DATA__ 快照垫片，本地版是 FastAPI 真实 /api）。 */
(function () {
  var cfg = window.__GEO_CONFIG__ || {};
  if (!cfg.supabaseUrl || !cfg.anonKey) return;
  var nativeFetch = window.fetch.bind(window);
  var H = { apikey: cfg.anonKey, Authorization: 'Bearer ' + cfg.anonKey };
  var base = cfg.supabaseUrl.replace(/\/$/, '') + '/rest/v1/';
  function sb(table, qs) {
    return nativeFetch(base + table + '?' + qs, { headers: H }).then(function (r) {
      if (!r.ok) throw new Error('supabase ' + table + ' ' + r.status);
      return r.json();
    });
  }
  var allP = null;
  function loadAll() {
    if (!allP) {
      allP = Promise.all([
        sb('sites', 'select=*&order=id.asc'),
        sb('audits', 'select=*&order=id.asc'),
        sb('baseline_snapshots', 'select=*&order=engine.asc,metric.asc'),
        sb('findings', 'select=*&order=layer.asc,id.asc'),
        sb('hypotheses', 'select=*&order=code.asc'),
        sb('prompts', 'select=*&order=site_id.asc,seq.asc'),
        sb('source_status', 'select=*&order=id.asc'),
        sb('rules', 'select=*&order=id.asc')
      ]).then(function (a) {
        return { sites: a[0], audits: a[1], baselines: a[2], findings: a[3],
                 hypotheses: a[4], prompts: a[5], sources: a[6], rules: a[7] };
      });
    }
    return allP;
  }
  function jparse(v) {
    if (typeof v === 'string') { try { return JSON.parse(v); } catch (e) { return v; } }
    return v;
  }
  function sitePayload(D, site) {
    var audit = null;
    D.audits.forEach(function (a) { if (a.site_id === site.id) audit = a; }); // id 升序，最后一个即最新
    if (audit) {
      audit = Object.assign({}, audit);
      audit.breakdown = jparse(audit.breakdown_json) || {};
      // 归一化：复测原始 JSON 的 breakdown 是扁平 {key: score}，种子行是 {key:{score,max}}，统一成后者
      var BD_MAX = {robots: 18, llms: 18, schema: 16, meta: 14, content: 12, signals: 6, ai_discovery: 6, brand_entity: 10};
      Object.keys(audit.breakdown).forEach(function (k) {
        if (typeof audit.breakdown[k] === 'number' && BD_MAX[k]) audit.breakdown[k] = {score: audit.breakdown[k], max: BD_MAX[k]};
      });
      audit.priorities = jparse(audit.priorities_json) || [];
      audit.failures = jparse(audit.failures_json) || [];
      delete audit.breakdown_json; delete audit.priorities_json; delete audit.failures_json;
    }
    var nb = D.baselines.filter(function (b) { return b.site_id === site.id; }).length;
    var out = Object.assign({}, site);
    out.audit = audit;
    out.baseline_count = nb;
    out.baseline_status = nb ? '有快照' : '尚无采样';
    out.findings_count = D.findings.filter(function (f) { return f.site_id === site.id; }).length;
    out.unconnected_sources = D.sources.filter(function (s) { return s.status !== '已接入'; }).length;
    return out;
  }
  var FUNNEL_DEFS = [
    ['L1', '可达', 'robots / CDN 放行、404 与重定向、sitemap、llms.txt、Schema 卫生'],
    ['L2', '被抓取', '三类 bot 是否真来过（日志）'],
    ['L3', '被收录', 'GSC 已索引数、URL Inspection'],
    ['L4', '被检索 / 曝光', 'GSC 曝光与排名、prompt 采样中被 retrieval 到'],
    ['L5', '被引用', 'Mention / Citation / Position / SoV（采样）'],
    ['L6', '点击', 'GSC 点击 / CTR、AI referral 会话'],
    ['L7', '转化', '北极星（产品埋点）']
  ];
  var FUNNEL_STATUS = {
    L1: ['有问题待修', '审计已接入，有实测数据；findings 为审计实锤'],
    L2: ['未接入', '日志未接入，无 bot 到访数据（不拿 robots allowed 冒充来过）'],
    L3: ['未接入', 'GSC 未接入，无收录数据'],
    L4: ['未接入', '依赖 GSC + 采样，均未常态化'],
    L5: ['部分有数据', '仅 CrossAgent 有 2026-10-29 单次快照；采样未常态化'],
    L6: ['未接入', '依赖 GSC / Analytics，未接入'],
    L7: ['未接入', '北极星已定义，产品埋点未接入，无转化数据']
  };
  function buildOverview(D) {
    return {
      as_of: '2026-11-02',
      sites: D.sites.map(function (s) { return sitePayload(D, s); }),
      sources: D.sources,
      funnel: FUNNEL_DEFS.map(function (fd) {
        var st = FUNNEL_STATUS[fd[0]];
        return { layer: fd[0], name: fd[1], desc: fd[2], status: st[0], note: st[1],
                 findings_count: D.findings.filter(function (f) { return f.layer === fd[0]; }).length };
      }),
      counts: {
        prompts: D.prompts.length,
        findings: D.findings.length,
        hypotheses_draft: D.hypotheses.filter(function (h) { return h.status === 'draft'; }).length,
        baselines: D.baselines.length,
        rules: D.rules.length
      },
      rules: D.rules
    };
  }
  function route(path) {
    return loadAll().then(function (D) {
      var domainOf = {};
      D.sites.forEach(function (s) { domainOf[s.id] = s.domain; });
      var withDomain = function (row) {
        return Object.assign({}, row, { site_domain: domainOf[row.site_id] || null });
      };
      if (path === '/api/overview') return buildOverview(D);
      if (path === '/api/findings') return D.findings.map(withDomain);
      if (path === '/api/hypotheses') return D.hypotheses.map(withDomain);
      if (path === '/api/prompts') {
        var out = {};
        D.sites.forEach(function (s) {
          out[s.domain] = D.prompts.filter(function (p) { return p.site_id === s.id; });
        });
        return out;
      }
      var m = path.match(/^\/api\/sites\/(\d+)$/);
      if (m) {
        var site = null;
        D.sites.forEach(function (s) { if (s.id === Number(m[1])) site = s; });
        if (!site) return undefined;
        var p = sitePayload(D, site);
        p.baselines = D.baselines.filter(function (b) { return b.site_id === site.id; });
        p.findings = D.findings.filter(function (f) { return f.site_id === site.id || f.site_id === null; });
        p.hypotheses = D.hypotheses.filter(function (h) { return h.site_id === site.id || h.site_id === null; });
        p.prompts_count = D.prompts.filter(function (x) { return x.site_id === site.id; }).length;
        return p;
      }
      return undefined;
    });
  }
  window.fetch = function (input, init) {
    var url = typeof input === 'string' ? input : (input && input.url) || '';
    var path = url;
    try { path = new URL(url, window.location.href).pathname; } catch (e) {}
    if (path.indexOf('/api/') !== 0) return nativeFetch(input, init);
    return route(path).then(function (data) {
      if (data === undefined) return nativeFetch(input, init);
      return new Response(JSON.stringify(data), {
        status: 200, headers: { 'Content-Type': 'application/json' }
      });
    }).catch(function () { return nativeFetch(input, init); }); // 活数据失败 → 回退快照/后端
  };
})();
</script>
<script>
const $ = id => document.getElementById(id);
const esc = s => (s ?? '').toString().replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const STATUS_CLASS = {
  '已接入': 'bg-green', '有快照': 'bg-green', '未接入': 'bg-red',
  '有问题待修': 'bg-orange', '未配置': 'bg-yellow', '部分有数据': 'bg-yellow'
};
const stBadge = s => {
  if (s === null || s === undefined || s === '') return '—';
  return `<span class="badge ${STATUS_CLASS[s] || 'bg-secondary'}">${esc(s)}</span>`;
};
const textCell = v => (v === null || v === undefined || v === '') ? '—' : esc(v);
const numCell = v => typeof v === 'number' ? String(v) : textCell(v);
const emptyRow = (n, status) =>
  `<tr class="fx-empty"><td colspan="${n}" role="status">${stBadge(status)}</td></tr>`;
const tableHtml = (labelledby, headers, bodyHtml) => {
  const th = headers.map(([field, label]) =>
    `<th scope="col" data-field="${esc(field)}">${esc(label)}</th>`).join('');
  return `<div class="card"><div class="table-responsive"><table class="table table-sm table-vcenter card-table" aria-labelledby="${esc(labelledby)}"><thead><tr>${th}</tr></thead><tbody>${bodyHtml}</tbody></table></div></div>`;
};
const load = url => fetch(url).then(r => {
  if (!r.ok) throw new Error(String(r.status));
  return r.json();
});

/* 边栏：移动端折叠 + 导航高亮（纯原生 JS，不依赖 Tabler JS） */
$('sb-toggle').addEventListener('click', () => $('sidebar-menu').classList.toggle('show'));
document.querySelectorAll('#sidebar-menu .nav-link').forEach(a =>
  a.addEventListener('click', () => {
    document.querySelectorAll('#sidebar-menu .nav-link').forEach(x => x.classList.remove('active'));
    a.classList.add('active');
  }));

/* 顶栏数据模式指示：按实际取数通道动态判定，不写死 */
(function detectMode() {
  const el = $('mode-badge');
  const set = (txt, cls) => { el.textContent = txt; el.className = 'badge ' + cls; };
  const cfg = window.__GEO_CONFIG__ || {};
  if (cfg.supabaseUrl && cfg.anonKey) {
    const url = cfg.supabaseUrl.replace(/\/$/, '') + '/rest/v1/sites?select=id&limit=1';
    fetch(url, { headers: { apikey: cfg.anonKey, Authorization: 'Bearer ' + cfg.anonKey } })
      .then(r => set(r.ok ? '活数据 · Supabase' : '快照 · 已回退', r.ok ? 'bg-green' : 'bg-yellow'))
      .catch(() => set('快照 · 已回退', 'bg-yellow'));
  } else if (window.__GEO_DATA__) {
    set('快照', 'bg-secondary');
  } else {
    set('本地 API', 'bg-blue');
  }
})();

const BD_FIELDS = ['robots', 'llms', 'schema', 'meta', 'content', 'signals', 'ai_discovery', 'brand_entity'];
const SCORE_HEADERS = [['domain', 'domain'], ['score', 'score'], ['band', 'band']]
  .concat(BD_FIELDS.map(k => [k, k]), [['negative_penalty', 'negative_penalty']]);
const SITE_HEADERS = [['domain', 'domain'], ['name', 'name'], ['role', 'role'],
  ['baseline_status', 'baseline_status'], ['baseline_count', 'baseline_count'],
  ['findings_count', 'findings_count'], ['north_star', 'north_star']];
const SOURCE_HEADERS = [['source', 'source'], ['label', 'label'], ['status', 'status'], ['updated_at', 'updated_at']];
const FUNNEL_HEADERS = [['layer', 'layer'], ['name', 'name'], ['status', 'status'], ['findings_count', 'findings_count']];
const FINDING_HEADERS = [['site', 'site'], ['layer', 'layer'], ['severity', 'severity'], ['title', 'title'], ['evidence', 'evidence']];
const RULE_HEADERS = [['name', 'name'], ['statement', 'statement'], ['evidence_level', 'evidence_level'], ['source', 'source']];
const BL_HEADERS = [['snapshot_date', 'snapshot_date'], ['engine', 'engine'], ['metric', 'metric'],
  ['subject', 'subject'], ['value', 'value'], ['unit', 'unit'], ['caliber', 'caliber'], ['source', 'source']];
const HROWS = [['假设', 'hypothesis'], ['主指标', 'primary_metric'], ['基线值', 'baseline_value'], ['目标', 'target'],
  ['护栏', 'guardrail'], ['成功阈值', 'threshold'], ['对照组', 'control_group'], ['成本', 'cost'], ['停止条件', 'stop_condition']];
const STATUS_ORDER = ['已接入', '未接入', '未配置', '未部署'];

const bdCell = (bd, key) => {
  const cell = bd && bd[key];
  if (!cell || typeof cell.score !== 'number') return '—';
  return typeof cell.max === 'number' ? `${cell.score}/${cell.max}` : String(cell.score);
};
const scoreKpi = s => {
  const a = s.audit;
  const has = !!(a && typeof a.score === 'number');
  const score = has
    ? `${a.score}<span class="text-muted fs-4"> / 100${a.band ? ' · ' + esc(a.band) : ''}</span>`
    : '—';
  return `<div class="card"><div class="card-body">
    <div class="subheader">卫生分</div>
    <div class="h1 mb-0 mt-1">${score}</div>
    <div class="text-muted mt-1" title="${esc(s.domain)}">${esc(s.domain)}</div>
  </div></div>`;
};
const statKpi = (label, num, unit) => {
  const value = (num === '—' || num === null || num === undefined)
    ? '—'
    : `${num}<span class="text-muted fs-4"> ${esc(unit)}</span>`;
  return `<div class="card"><div class="card-body">
    <div class="subheader">${esc(label)}</div>
    <div class="h1 mb-0 mt-1">${value}</div>
  </div></div>`;
};
const siteRow = s => `<tr>
  <td>${textCell(s.domain)}</td><td>${textCell(s.name)}</td><td>${textCell(s.role)}</td>
  <td>${s.baseline_status ? stBadge(s.baseline_status) : '—'}</td>
  <td>${numCell(s.baseline_count)}</td><td>${numCell(s.findings_count)}</td>
  <td class="fx-wrap">${textCell(s.north_star)}</td></tr>`;
const scoreRow = s => {
  const a = s.audit || {};
  const bd = a.breakdown || {};
  const score = typeof a.score === 'number' ? String(a.score) : '—';
  const cells = BD_FIELDS.map(k => `<td>${bdCell(bd, k)}</td>`).join('');
  const pen = typeof bd.negative_penalty === 'number' ? String(bd.negative_penalty) : '—';
  return `<tr><td>${textCell(s.domain)}</td><td>${score}</td><td>${textCell(a.band)}</td>${cells}<td>${pen}</td></tr>`;
};
const sourceRow = x => `<tr data-source="${esc(x.source || '')}" data-status="${esc(x.status || '')}" data-detail="${esc(x.detail || '')}" data-next-step="${esc(x.next_step || '')}">
  <td>${textCell(x.source)}</td><td>${textCell(x.label)}</td><td>${stBadge(x.status)}</td><td>${textCell(x.updated_at)}</td></tr>`;
const sourceBody = sources => (!sources || !sources.length)
  ? emptyRow(SOURCE_HEADERS.length, '未接入')
  : sources.map(sourceRow).join('');
const funnelRow = f => `<tr data-layer="${esc(f.layer || '')}" data-status="${esc(f.status || '')}" data-note="${esc(f.note || '')}">
  <td>${textCell(f.layer)}</td><td>${textCell(f.name)}</td><td>${stBadge(f.status)}</td><td>${numCell(f.findings_count)}</td></tr>`;
const findingRow = f => `<tr data-detail="${esc(f.detail || '')}" data-source="${esc(f.source || '')}" data-severity="${esc(f.severity || '')}">
  <td>${textCell(f.site_domain || f.scope)}</td><td>${textCell(f.layer)}</td>
  <td>${f.severity ? stBadge(f.severity) : '—'}</td>
  <td class="fx-wrap">${textCell(f.title)}</td><td class="fx-wrap">${textCell(f.evidence)}</td></tr>`;
const ruleRow = r => `<tr>
  <td class="fx-wrap">${textCell(r.name)}</td><td class="fx-wrap">${textCell(r.statement)}</td>
  <td>${textCell(r.evidence_level)}</td><td class="fx-wrap">${textCell(r.source)}</td></tr>`;
const renderSourceCounts = sources => {
  const el = $('source-counts');
  if (!sources || !sources.length) { el.innerHTML = ''; return; }
  const counts = {};
  sources.forEach(s => { const k = s.status || '—'; counts[k] = (counts[k] || 0) + 1; });
  const keys = STATUS_ORDER.filter(k => counts[k]).concat(Object.keys(counts).filter(k => !STATUS_ORDER.includes(k) && k !== '—'));
  el.innerHTML = keys.map(k =>
    `<span class="fx-stat" data-status="${esc(k)}" data-count="${counts[k]}">${stBadge(k)} <span class="fx-count">${counts[k]}</span></span>`).join('');
};

const renderOverview = o => {
  const failed = !o || typeof o !== 'object';
  const sites = !failed && Array.isArray(o.sites) ? o.sites : [];
  const sources = !failed && Array.isArray(o.sources) ? o.sources : null;
  const funnel = !failed && Array.isArray(o.funnel) ? o.funnel : null;
  const rules = !failed && Array.isArray(o.rules) ? o.rules : null;
  const counts = !failed && o.counts && typeof o.counts === 'object' ? o.counts : null;
  const asof = $('asof');
  if (!failed && o.as_of) {
    const t = $('asof-date');
    t.textContent = o.as_of;
    t.setAttribute('datetime', String(o.as_of));
    asof.hidden = false;
  } else asof.hidden = true;
  const runs = sites.map(s => s.audit && s.audit.run_at).filter(Boolean).sort();
  $('last-updated').textContent = runs.length ? '审计 ' + String(runs[runs.length - 1]).slice(0, 10) : '';
  $('kpi-row').innerHTML = sites.map(scoreKpi).join('')
    + statKpi('findings', counts && typeof counts.findings === 'number' ? counts.findings : '—', '条')
    + statKpi('draft', counts && typeof counts.hypotheses_draft === 'number' ? counts.hypotheses_draft : '—', '张');
  $('sites').innerHTML = tableHtml('sites-h', SITE_HEADERS,
    sites.length ? sites.map(siteRow).join('') : emptyRow(SITE_HEADERS.length, '无记录'));
  $('scores').innerHTML = tableHtml('scores-h', SCORE_HEADERS,
    sites.length ? sites.map(scoreRow).join('') : emptyRow(SCORE_HEADERS.length, '无记录'));
  renderSourceCounts(sources);
  $('sources-table').innerHTML = tableHtml('sources-h', SOURCE_HEADERS, sourceBody(sources));
  $('funnel-table').innerHTML = tableHtml('funnel-h', FUNNEL_HEADERS,
    funnel && funnel.length ? funnel.map(funnelRow).join('') : emptyRow(FUNNEL_HEADERS.length, '无记录'));
  $('rules-table').innerHTML = tableHtml('rules-h', RULE_HEADERS,
    rules && rules.length ? rules.map(ruleRow).join('') : emptyRow(RULE_HEADERS.length, '无记录'));
};

const renderFindings = fs => {
  const body = Array.isArray(fs) && fs.length ? fs.map(findingRow).join('') : emptyRow(FINDING_HEADERS.length, '无记录');
  $('findings-table').innerHTML = tableHtml('findings-h', FINDING_HEADERS, body);
};
const renderHyps = hs => {
  if (!Array.isArray(hs) || !hs.length) {
    $('hyps').innerHTML = `<div class="card"><div class="card-body" role="status">${stBadge('无记录')}</div></div>`;
    return;
  }
  $('hyps').innerHTML = hs.map(h => {
    const scope = h.scope ? ` · ${esc(h.scope)}` : '';
    return `<details class="card fx-hyp mb-3" data-code="${esc(h.code)}" data-status="${esc(h.status || '')}" data-layer="${esc(h.layer || '')}">
      <summary>${esc(h.code)} · ${esc(h.title)} ${stBadge(h.status)}
        <span class="text-muted">${esc(h.layer || '')}${scope}</span></summary>
      <div class="table-responsive"><table class="table table-sm table-vcenter card-table mb-0">${HROWS.map(([label, field]) =>
        `<tr><th scope="row" data-field="${esc(field)}">${esc(label)}</th><td class="fx-wrap">${textCell(h[field])}</td></tr>`).join('')}</table></div>
    </details>`;
  }).join('');
};
const baselineTable = (rows, labelId) => {
  const body = Array.isArray(rows) && rows.length ? rows.map(b => `<tr>
      <td>${textCell(b.snapshot_date)}</td><td>${textCell(b.engine)}</td><td>${textCell(b.metric)}</td>
      <td>${textCell(b.subject)}</td><td>${numCell(b.value)}</td><td>${textCell(b.unit)}</td>
      <td class="fx-wrap">${textCell(b.caliber)}</td><td class="fx-wrap">${textCell(b.source)}</td></tr>`).join('')
    : emptyRow(BL_HEADERS.length, Array.isArray(rows) ? '尚无采样' : '无记录');
  return tableHtml(labelId, BL_HEADERS, body);
};
const renderBaselines = (lab, main) => {
  const sites = [lab, main].filter(s => s && s.domain);
  $('baselines-body').innerHTML = sites.length ? sites.map(s => {
    const hid = 'bl-' + s.id;
    return `<h3 class="fx-sub" id="${esc(hid)}">${esc(s.name)} <span class="text-muted fw-normal">${esc(s.domain)}</span></h3>`
      + baselineTable(Array.isArray(s.baselines) ? s.baselines : [], hid);
  }).join('') : baselineTable(null, 'baselines-h');
};
const renderPrompts = all => {
  const domains = all && typeof all === 'object' && !Array.isArray(all)
    ? Object.keys(all).filter(d => Array.isArray(all[d])) : [];
  if (!domains.length) {
    $('ptabs').innerHTML = '';
    $('plist').innerHTML = stBadge('无记录');
    return;
  }
  const tabLabel = (d, rows) => {
    const vers = [...new Set(rows.map(p => p.set_version).filter(Boolean))];
    return vers.length === 1 ? `${d} · ${vers[0]} · ${rows.length}` : `${d} · ${rows.length}`;
  };
  $('ptabs').innerHTML = domains.map((d, i) =>
    `<li class="nav-item"><button type="button" data-d="${esc(d)}" class="nav-link ${i === 0 ? 'active' : ''}">${esc(tabLabel(d, all[d]))}</button></li>`).join('');
  const show = d => {
    const cats = {};
    all[d].forEach(p => { (cats[p.category] = cats[p.category] || []).push(p); });
    $('plist').innerHTML = Object.entries(cats).map(([c, ps]) =>
      `<div class="fx-cat">${esc(c)} · ${ps.length}</div><ol class="fx-prompts">` +
      ps.map(p => `<li data-seq="${esc(p.seq)}">${esc(p.text)}</li>`).join('') + '</ol>').join('');
    document.querySelectorAll('#ptabs button').forEach(b => b.classList.toggle('active', b.dataset.d === d));
  };
  document.querySelectorAll('#ptabs button').forEach(b => { b.onclick = () => show(b.dataset.d); });
  show(domains[0]);
};

load('/api/overview').then(renderOverview).catch(() => renderOverview(null));
load('/api/findings').then(renderFindings).catch(() => renderFindings(null));
load('/api/hypotheses').then(renderHyps).catch(() => renderHyps(null));
load('/api/prompts').then(renderPrompts).catch(() => renderPrompts(null));
Promise.all([
  load('/api/sites/2').catch(() => null),
  load('/api/sites/1').catch(() => null)
]).then(([lab, main]) => renderBaselines(lab, main));
</script>
</body>
</html>
